[package]
name = "reelforge"
version = "0.1.0"
edition = "2021"
description = "Lightweight, fast timeline video editor for Windows"

[dependencies]
eframe = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rodio = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
