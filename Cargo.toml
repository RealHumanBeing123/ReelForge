[package]
name = "reelforge"
version = "0.1.0"
edition = "2021"
description = "Lightweight, fast timeline video editor for Windows"

[dependencies]
eframe = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rodio = "0.19"
cpal = "0.15"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Quicker local builds: `cargo build --profile fast` (output in target\fast\). Slightly larger
# and a little slower at runtime than `--release`, but compiles several times faster.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
